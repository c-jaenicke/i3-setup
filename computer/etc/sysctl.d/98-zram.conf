# Tuning for zram-backed swap (see /etc/systemd/zram-generator.conf).
# zram is RAM-backed and fast, so the disk-swap-era defaults are too
# conservative and too batch-oriented for it.

# Swap to zram more eagerly than the disk-swap default of 60.
vm.swappiness = 150

# zram doesn't benefit from multi-page readahead like a real disk does;
# swap pages one at a time.
vm.page-cluster = 0
