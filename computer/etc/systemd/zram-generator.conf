# Configuration for systemd's zram-generator.
# Docs: https://github.com/systemd/zram-generator
#
# Replaces openSUSE's built-in zramswap.service, which hardcodes
# zram size to 100% of RAM with no way to tune it. That service must be
# disabled (systemctl disable --now zramswap.service) or it will fight
# over /dev/zram0 with this generator.

[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
