# ##################################################################################################
# systemd-resolved DNS-over-TLS (DoT)
# ##################################################################################################

[Resolve]
# Use Cloudflare and Quad9 as primary DoT providers
DNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 1.0.0.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net

# 'opportunistic' mode: Uses DoT if available, falls back to plain DNS if it fails.
# This prevents the system from losing internet if port 853 is blocked or hangs.
DNSOverTLS=opportunistic

# Fallback to standard DNS if the above providers are unreachable
FallbackDNS=8.8.8.8 8.8.4.4

# Keep DNSSEC on 'allow-downgrade' to avoid breaking connections on restrictive networks
DNSSEC=allow-downgrade

# Ensure all queries go to the configured servers
Domains=~.
