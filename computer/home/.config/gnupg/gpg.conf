# ##################################################################################################
# GnuPG Configuration
# Hardened for 2025 (SHA512, AES256, S2K Hardening)
# ##################################################################################################

# -----------------------------
# Behavior & Privacy
# -----------------------------
no-greeting
no-emit-version
no-comments
keyid-format 0xlong
with-fingerprint
list-options show-uid-validity
verify-options show-uid-validity

# -----------------------------
# Algorithm & Cipher Preferences
# -----------------------------
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256 SHA224
default-preference-list SHA512 SHA384 SHA256 SHA224 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
digest-algo SHA512

# -----------------------------
# S2K (String-to-Key) Hardening
# -----------------------------
s2k-cipher-algo AES256
s2k-digest-algo SHA512
s2k-mode 3
# Maximize iterations to slow down brute-force (65011712 is the max value)
s2k-count 65011712

# -----------------------------
# Security & Weak Algorithm Disabling
# -----------------------------
weak-digest SHA1
disable-cipher-algo 3DES
force-mdc

# -----------------------------
# Keyserver Settings
# -----------------------------
keyserver hkps://keys.openpgp.org
keyserver-options no-honor-keyserver-url
keyserver-options include-revoked
