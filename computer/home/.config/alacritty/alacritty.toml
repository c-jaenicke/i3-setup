####################################################################################################
# Alacritty Terminal Emulator
####################################################################################################

###########################################################################
# GENERAL SETTINGS
###########################################################################
[general]
live_config_reload = true

import = [
    "~/.config/alacritty/secret_theme.toml",
   # "~/.config/alacritty/meitnerium_theme.toml"
]

###########################################################################
# CURSOR
###########################################################################
[cursor.style]
blinking = "Off"
shape = "Beam"

###########################################################################
# FONTS
###########################################################################
[font]
size = 11

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

